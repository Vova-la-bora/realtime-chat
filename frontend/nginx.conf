# Раздаёт собранный фронтенд и балансирует /api и /ws между двумя инстансами бэкенда.
# Один origin для страницы, REST и WebSocket: refresh-cookie работает без CORS.
upstream chat_api {
  # Новое подключение уходит на инстанс с наименьшим числом активных соединений.
  # WebSocket остаётся на выбранном инстансе, пока открыт; REST без состояния, ему всё равно.
  least_conn;
  server api1:3000;
  server api2:3000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Если инстанс остановлен, подключение к нему не должно висеть дольше нескольких секунд:
  # запрос уходит на следующий инстанс, а недоступный на 10 секунд исключается из выбора
  proxy_connect_timeout 3s;
  proxy_next_upstream error timeout http_502 http_503;

  location /api/ {
    proxy_pass http://chat_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://chat_api;
  }

  location /ws {
    proxy_pass http://chat_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Клиент шлёт ping каждые 25 секунд, поэтому 75 секунд с запасом
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
